<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Portfolio</h1>
        <p>Danh sách các dự án của tôi</p>
    </header>


    <main>

        <!-- KHU VỰC THÊM / SỬA -->
        <section class="project-form">

            <h2 id="formTitle">Thêm Project</h2>

            <input type="hidden" id="projectId">

            <input
                type="text"
                id="title"
                placeholder="Tên project"
            >

            <textarea
                id="description"
                placeholder="Mô tả project"
            ></textarea>

            <input
                type="text"
                id="githubUrl"
                placeholder="GitHub URL"
            >

            <input
                type="text"
                id="demoUrl"
                placeholder="Demo URL"
            >

            <input
                type="text"
                id="imageUrl"
                placeholder="Image URL"
            >

            <button onclick="saveProject()">
                Lưu Project
            </button>

            <button onclick="cancelEdit()">
                Hủy
            </button>

        </section>


        <!-- DANH SÁCH PROJECT -->
        <section>

            <h2>Projects</h2>

            <div id="projects"></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
